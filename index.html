<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Disney World trip plan</title>
<!-- Created by Avinash -->
<meta name="theme-color" content="#17202B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="author" content="Avinash">
<meta name="apple-mobile-web-app-title" content="Disney Trip">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  color-scheme:light dark;
  --ink:#17202B; --muted:#56616E; --paper:#F2F5F4; --card:#FFFFFF; --line:#D5DCDA;
  --chg:#8F4300; --chgbg:#FDEFD9; --ver:#1B45B8; --verbg:#E6EDFD;
  --add:#0B6B45; --addbg:#DDF3E8; --rem:#9B1239; --rembg:#FCE4EA; --call:#5B2A9E; --callbg:#EFE6FB;
  --onc:#fff;
}
.t-ak{--c:#1F7A4D}
.t-mk1{--c:#3347B8}
.t-mk2{--c:#A3306F}
@media (prefers-color-scheme:dark){
  :root{
    --ink:#E9EFF1; --muted:#A5B0BA; --paper:#0F1518; --card:#182024; --line:#2B363B;
    --chg:#FFC27A; --chgbg:#3A2A12; --ver:#9DB7FF; --verbg:#1B2745;
    --add:#7BE0B1; --addbg:#12342A; --rem:#FF9DB5; --rembg:#3E1623; --call:#CDAEFF; --callbg:#2C1D47;
    --onc:#0B1210;
  }
  .t-ak{--c:#46C08A}
  .t-mk1{--c:#8C9DFF}
  .t-mk2{--c:#F083BA}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font:16px/1.45 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--c);outline-offset:2px}

/* header */
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--paper) 92%,transparent);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:800;font-size:17px;letter-spacing:-.01em}
.count{font-size:13px;color:var(--muted)}
.share{border:1.5px solid var(--ink);background:transparent;border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px}
.days{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.day-btn{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:8px 6px 9px;text-align:center;line-height:1.1}
.day-btn .dw{font-size:13px;color:var(--muted);font-weight:600}
.day-btn .dn{display:block;font-size:30px;font-weight:800;letter-spacing:-.03em;margin:2px 0 3px}
.day-btn .dp{font-size:12px;font-weight:600}
.day-btn[aria-pressed=true]{background:var(--c);border-color:var(--c);color:var(--onc)}
.day-btn[aria-pressed=true] .dw{color:inherit;opacity:.85}

main{padding:18px 16px 8px;max-width:640px;margin:0 auto}
h1{font-size:30px;line-height:1.05;letter-spacing:-.025em;margin:2px 0 4px;font-weight:800}
.sub{margin:0;color:var(--muted);font-weight:600}
.hours{margin:10px 0 0;font-weight:700;color:var(--c)}
.hours small{display:block;font-weight:500;color:var(--muted);font-size:13px}

.heads{margin:16px 0 22px;padding:12px 14px;list-style:none;border-left:5px solid var(--c);background:var(--card);border-radius:0 12px 12px 0}
.heads li+li{margin-top:8px}
.heads li{font-size:15px}

/* timeline */
.tl{list-style:none;margin:0 0 6px 10px;padding:0;border-left:3px solid var(--line)}
.blk{position:relative;padding:0 0 20px 20px}
.blk::before{content:"";position:absolute;left:-9.5px;top:3px;width:16px;height:16px;border-radius:50%;
  background:var(--paper);border:3px solid var(--muted)}
.blk.now::before{background:var(--c);border-color:var(--c);box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 25%,transparent)}
.blk.past::before{border-color:var(--line)}
.when{font-weight:800;font-size:15px;color:var(--c);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.nowpill{background:var(--c);color:var(--onc);font-size:12px;padding:1px 9px;border-radius:999px}
.blk h2{margin:1px 0 4px;font-size:19px;letter-spacing:-.01em;font-weight:800}
.items{list-style:none;margin:0;padding:0}
.it{display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.it:first-child{border-top:0}
.it input,.it .x{flex:none;width:26px;height:26px;margin:1px 0 0}
.it input{-webkit-appearance:none;appearance:none;border:2px solid var(--muted);border-radius:8px;background:var(--card);display:grid;place-content:center}
.it input:checked{background:var(--c);border-color:var(--c)}
.it input:checked::after{content:"";width:6px;height:12px;border:solid var(--onc);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.it .x{display:grid;place-content:center;color:var(--rem);font-weight:800}
.it label{display:flex;gap:12px;flex:1;align-items:flex-start}
.tx{flex:1;min-width:0}
.ttl{font-weight:600}
.ico{margin-right:6px}
.it input:checked ~ .tx .ttl{text-decoration:line-through;color:var(--muted)}
.it.rm .ttl{text-decoration:line-through;color:var(--muted)}
.note{margin:3px 0 0;font-size:14px;color:var(--muted)}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;margin-left:6px;vertical-align:1px;white-space:nowrap}
.b-changed{background:var(--chgbg);color:var(--chg)}
.b-verify{background:var(--verbg);color:var(--ver)}
.b-added{background:var(--addbg);color:var(--add)}
.b-removed{background:var(--rembg);color:var(--rem)}
.b-call{background:var(--callbg);color:var(--call)}

.skip{margin:8px 0 0;padding:14px;border-radius:14px;background:var(--rembg)}
.skip h2{margin:0 0 6px;font-size:17px;color:var(--rem)}
.skip ul{margin:0;padding:0;list-style:none}
.skip li{padding:5px 0;font-size:15px}
.skip li b{font-weight:800}
.skip li.gone b{text-decoration:line-through}

/* notes & rules */
section.sec{margin:0 0 26px}
section.sec h2{font-size:22px;letter-spacing:-.02em;margin:0 0 4px;font-weight:800}
section.sec>p{margin:0 0 10px;color:var(--muted);font-size:15px}
.rows{list-style:none;margin:0;padding:0}
.rows>li{padding:11px 0;border-top:1px solid var(--line)}
.rows>li:first-child{border-top:0}
.rows b{display:block;font-weight:800}
.rows span{display:block;font-size:15px;color:var(--muted)}
.rows.chk>li{padding:0}
.rows.chk label{display:flex;gap:12px;align-items:flex-start;padding:11px 0}
.rows.chk input{-webkit-appearance:none;appearance:none;flex:none;width:26px;height:26px;border:2px solid var(--muted);border-radius:8px;background:var(--card);display:grid;place-content:center;margin:0}
.rows.chk input:checked{background:var(--c);border-color:var(--c)}
.rows.chk input:checked::after{content:"";width:6px;height:12px;border:solid var(--onc);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.rows.chk input:checked + span{text-decoration:line-through}
.rows.chk span{color:var(--ink);font-size:16px}
ol.how{margin:0;padding-left:20px}
ol.how li{margin:6px 0}
.fine{font-size:13px;color:var(--muted);margin-top:18px}


/* wait chips, alternates, buttons, inputs */
.wt{display:none;margin-left:6px;font-size:12px;font-weight:800;padding:1px 8px;border-radius:999px;vertical-align:1px;white-space:nowrap}
.wt.on{display:inline-block}
.w-low{background:var(--addbg);color:var(--add)}
.w-mid{background:var(--chgbg);color:var(--chg)}
.w-high{background:var(--rembg);color:var(--rem)}
.w-off{background:var(--line);color:var(--muted)}
.b-h{background:var(--line);color:var(--ink)}
details.more{margin:18px 0 6px;background:var(--card);border-radius:14px;padding:2px 14px}
details.more summary{font-weight:800;padding:12px 0;cursor:pointer}
.altlist{list-style:none;margin:0;padding:0}
.altlist li{padding:10px 0;border-top:1px solid var(--line)}
.altlist .note{margin-top:2px}
.alt-t{font-weight:700}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 4px}
.seg .btn[aria-pressed=true]{background:var(--c);border-color:var(--c);color:var(--onc)}
.btn{border:1.5px solid var(--ink);background:transparent;border-radius:12px;padding:11px 14px;font-weight:700}
.btn.pri{background:var(--c);border-color:var(--c);color:var(--onc)}
.btn.warn{border-color:var(--rem);color:var(--rem)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.inp{width:100%;font:inherit;font-size:16px;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);margin:6px 0 10px}
label.lbl{display:block;font-weight:700;font-size:14px;margin-top:6px}
.wrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.wrow:first-child{border-top:0}
.wrow>span:first-child{color:var(--ink);font-size:16px}
.wrow small{display:block;color:var(--muted);font-size:13px}
.wrow .wt{display:inline-block;margin:0}
.mem{padding:12px 0;border-top:1px solid var(--line)}
.mem:first-child{border-top:0}
.mem b{font-weight:800}
.mem .meta{color:var(--muted);font-size:14px}
.mem.stale .meta{color:var(--rem)}
.mem a{color:var(--c);font-weight:700}
.stat{font-size:14px;color:var(--muted);margin:6px 0 0}
.err{background:var(--rembg);color:var(--rem);padding:10px 12px;border-radius:12px;font-size:14px;margin:10px 0}
pre.sql{white-space:pre-wrap;word-break:break-word;font:12px/1.4 ui-monospace,Menlo,monospace;background:var(--card);padding:10px;border-radius:10px;max-height:220px;overflow:auto}


/* map, walking and ordering notes */
.map{position:relative;isolation:isolate;height:min(58vh,460px);min-height:300px;border-radius:14px;overflow:hidden;background:var(--card);margin:10px 0}
.pin span{display:grid;place-content:center;width:28px;height:28px;border-radius:50%;background:var(--c);color:var(--onc);font:800 13px/1 ui-rounded,system-ui,sans-serif;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.legs{list-style:none;margin:0;padding:0}
.legs li{padding:10px 0;border-top:1px solid var(--line)}
.legs li:first-child{border-top:0}
.legs .meta{display:block;color:var(--muted);font-size:14px}
.walk{font-size:14px;color:var(--muted);margin:-10px 0 14px}
.whylist{margin:0;padding:0 0 12px 18px}
.whylist li{margin:8px 0;font-size:15px}
.b-moved{background:var(--chgbg);color:var(--chg)}


/* signature, reminders, filters */
.catlist .badge{display:inline-block;margin:2px 6px 2px 0}
.sig{margin:28px 0 6px;text-align:center;font-size:13px;color:var(--muted);letter-spacing:.02em}
.remind{background:var(--chgbg);color:var(--chg);border-radius:14px;padding:12px 14px;margin:0 0 16px}
.remind b{display:block;margin-bottom:6px}
.rline{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;color:var(--ink)}
.rline .btn{padding:6px 12px;border-color:var(--chg);color:var(--chg)}
.rem{padding:10px 0;border-top:1px solid var(--line)}
.rem:first-child{border-top:0}
.remlab{display:flex;gap:12px;align-items:flex-start}
.remlab input{-webkit-appearance:none;appearance:none;flex:none;width:26px;height:26px;margin:1px 0 0;border:2px solid var(--muted);border-radius:8px;background:var(--card);display:grid;place-content:center}
.remlab input:checked{background:var(--c);border-color:var(--c)}
.remlab input:checked::after{content:"";width:6px;height:12px;border:solid var(--onc);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.rem.done .ttl{text-decoration:line-through;color:var(--muted)}
.rem small{display:block;color:var(--muted);font-size:13px}
.rbtns{display:flex;gap:18px;margin:4px 0 0 38px}
.linkbtn{border:0;background:transparent;color:var(--c);font-weight:700;padding:6px 0;text-decoration:underline}
.linkbtn:last-child{color:var(--rem)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
.chipbtn{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px}
.chipbtn[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.morebox{margin:14px 0 6px;background:var(--card);border-radius:14px;padding:12px 14px}
textarea.inp{resize:vertical;min-height:110px}


/* check-ins, meals and shopping */
.ckrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.pchip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 13px;font-weight:700;font-size:14px;min-height:36px;color:var(--ink)}
.pchip[aria-pressed=true]{background:var(--c);border-color:var(--c);color:var(--onc)}
.also{display:block;width:100%;font-size:13px;color:var(--muted);font-weight:500}
.who{font-size:14px;color:var(--muted);margin:-6px 0 14px}
.who .linkbtn{padding:0 0 0 4px}
.meal{padding:12px 0;border-top:1px solid var(--line)}
.meal:first-of-type{border-top:0}
.meal .mt{display:block;font-weight:800;color:var(--c);font-size:14px}
.meal b{display:block;font-weight:800}
.meal p{margin:2px 0 0;font-size:15px;color:var(--muted)}
.shoprow{padding:9px 0;border-top:1px solid var(--line)}
.shoprow:first-child{border-top:0}
.shoprow small{display:block;color:var(--muted);font-size:13px}
.stepper{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:8px 0}
.stepper b{min-width:20px;text-align:center}
.stepper .btn{padding:4px 14px;font-size:18px}
.chipbtn.pn{display:inline-flex;gap:8px;align-items:center}
.xbtn{border:0;background:transparent;font-weight:800;color:var(--rem);padding:0 2px;font-size:14px}

.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 4px}
.seg3 .btn{padding:11px 6px;font-size:15px}
.seg3 .btn[aria-pressed=true]{background:var(--c);border-color:var(--c);color:var(--onc)}
h3.land{font-size:15px;color:var(--muted);margin:14px 0 2px;font-weight:700}

/* bottom tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(6,1fr);
  background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tab{border:0;background:transparent;padding:16px 1px;font-size:13px;font-weight:700;color:var(--muted);border-top:3px solid transparent}
.tab[aria-current=page]{color:var(--ink);border-top-color:var(--c)}

.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-weight:700;font-size:14px;z-index:9;
  opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>

<header class="top">
  <div class="top-row">
    <div>
      <div class="brand">Disney World, Nov 21–25</div>
      <div class="count" id="count"></div>

    <button class="share" id="share" type="button">Share</button>

  <nav class="days" id="days" aria-label="Day"></nav>
</header>
<main id="view"></main>
<nav class="tabs" id="tabs" aria-label="Sections">

</nav>

// Run once in Supabase (SQL Editor) to create the location table and its three functions.
const SETUP_SQL=`create table if not exists public.locations(
  code text not null check (length(code) >= 20),
  member text not null check (length(member) between 1 and 40),
  lat double precision not null check (lat between -90 and 90),
  lng double precision not null check (lng between -180 and 180),
  acc real,
  updated_at timestamptz not null default now(),
  primary key (code, member)
);
alter table public.locations enable row level security;
revoke all on public.locations from anon, authenticated;

create or replace function public.share_location(p_code text, p_member text, p_lat double precision, p_lng double precision, p_acc real)
returns void language plpgsql security definer set search_path = public as $$
begin
  if length(p_code) < 20 then raise exception 'bad code'; end if;
  delete from public.locations where updated_at < now() - interval '12 hours';
  insert into public.locations(code, member, lat, lng, acc, updated_at)
  values (p_code, left(trim(p_member), 40), p_lat, p_lng, p_acc, now())
  on conflict (code, member) do update
    set lat = excluded.lat, lng = excluded.lng, acc = excluded.acc, updated_at = now();
end $$;

create or replace function public.get_locations(p_code text)
returns table(member text, lat double precision, lng double precision, acc real, updated_at timestamptz)
language sql security definer set search_path = public stable as $$
  select member, lat, lng, acc, updated_at from public.locations
  where code = p_code and length(p_code) >= 20 and updated_at > now() - interval '12 hours';
$$;

create or replace function public.stop_sharing(p_code text, p_member text)
returns void language sql security definer set search_path = public as $$
  delete from public.locations where code = p_code and member = p_member and length(p_code) >= 20;
$$;

revoke all on function public.share_location(text,text,double precision,double precision,real) from public;
revoke all on function public.get_locations(text) from public;
revoke all on function public.stop_sharing(text,text) from public;
grant execute on function public.share_location(text,text,double precision,double precision,real) to anon;
grant execute on function public.get_locations(text) to anon;
grant execute on function public.stop_sharing(text,text) to anon;`;

const SETUP_SQL_2=`create table if not exists public.group_data(
  code text not null check (length(code) >= 20),
  kind text not null check (kind in ('ride','person','rem','shop','shopx')),
  key text not null check (length(key) between 1 and 160),
  val text not null check (length(val) <= 4000),
  updated_at timestamptz not null default now(),
  primary key (code, kind, key)
);
alter table public.group_data enable row level security;
revoke all on public.group_data from anon, authenticated;

create or replace function public.gd_put(p_code text, p_kind text, p_key text, p_val text)
returns void language plpgsql security definer set search_path = public as $$
begin
  if length(p_code) < 20 then raise exception 'bad code'; end if;
  delete from public.group_data where updated_at < now() - interval '30 days';
  if (select count(*) from public.group_data where code = p_code) >= 3000
     and not exists (select 1 from public.group_data where code = p_code and kind = p_kind and key = p_key) then
    raise exception 'too many rows';
  end if;
  insert into public.group_data(code, kind, key, val, updated_at)
  values (p_code, p_kind, p_key, p_val, now())
  on conflict (code, kind, key) do update set val = excluded.val, updated_at = now();
end $$;

create or replace function public.gd_del(p_code text, p_kind text, p_key text)
returns void language sql security definer set search_path = public as $$
  delete from public.group_data where code = p_code and kind = p_kind and key = p_key and length(p_code) >= 20;
$$;

create or replace function public.gd_list(p_code text)
returns table(kind text, key text, val text, updated_at timestamptz)
language sql security definer set search_path = public stable as $$
  select kind, key, val, updated_at from public.group_data where code = p_code and length(p_code) >= 20;
$$;

revoke all on function public.gd_put(text,text,text,text) from public;
revoke all on function public.gd_del(text,text,text) from public;
revoke all on function public.gd_list(text) from public;
grant execute on function public.gd_put(text,text,text,text) to anon;
grant execute on function public.gd_del(text,text,text) to anon;
grant execute on function public.gd_list(text) to anon;`;

function nowET(){
  const f=new Intl.DateTimeFormat("en-CA",{timeZone:"America/New_York",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"});
  const p=Object.fromEntries(f.formatToParts(new Date()).map(x=>[x.type,x.value]));
  return {date:p.year+"-"+p.month+"-"+p.day,mins:(+p.hour)*60+(+p.minute)};
}
const mins=t=>{const [h,m]=t.split(":").map(Number);return h*60+m};
function fmt(t){const [h,m]=t.split(":").map(Number);const ap=h>=12?"PM":"AM";return ((h+11)%12+1)+":"+String(m).padStart(2,"0")+" "+ap}
function range(s,e){
  const a=fmt(s),b=fmt(e);
  return a.slice(-2)===b.slice(-2)?a.slice(0,-3)+" – "+b:a+" – "+b;
}
const dayNum=d=>{const [y,m,dd]=d.split("-").map(Number);return Date.UTC(y,m-1,dd)/864e5};

function pickDay(){
  const today=nowET().date;
  const i=DAYS.findIndex(d=>d.date===today);
  if(i>=0)return i;
  const j=DAYS.findIndex(d=>d.date>today);
  return j>=0?j:0;
}
function countdown(){
  const today=nowET().date,n=dayNum(DAYS[0].date)-dayNum(today);
  const last=dayNum(DAYS[DAYS.length-1].date)-dayNum(today);
  if(n>1)return n+" days to go";
  if(n===1)return "Tomorrow";
  if(last>=0)return DAYS.some(d=>d.date===today)?"Trip day (Orlando time)":"Between park days";
  return "Trip complete";
}

const waits=store.get("waits",{});   // {ak:{ts,list:[{n,x,t,s,w}]}, mk:{...}}
const werr={};
let wBusy=false;

async function getJSON(url){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),9000);
  try{const r=await fetch(url,{signal:c.signal});if(!r.ok)throw new Error("HTTP "+r.status);return await r.json()}
  finally{clearTimeout(t)}
}
async function loadPark(k){
  const P=PARKS[k];let j;
  try{j=await getJSON(API+"/entity/"+P.id+"/live")}
  catch(e){
    try{
      const d=await getJSON(API+"/destinations");
      const p=(d.destinations||[]).flatMap(x=>x.parks||[]).find(x=>P.re.test(x.name));
      if(!p)throw e;
      P.id=p.id;j=await getJSON(API+"/entity/"+p.id+"/live");
    }catch(e2){throw e}
  }
  return (j.liveData||[]).filter(e=>e.entityType==="ATTRACTION"||e.entityType==="SHOW").map(e=>({
    n:e.name,x:norm(e.name),t:e.entityType,s:e.status,
    w:e.queue&&e.queue.STANDBY&&e.queue.STANDBY.waitTime!=null?e.queue.STANDBY.waitTime:null
  }));
}
async function refreshWaits(){
  if(wBusy)return;wBusy=true;
  await Promise.all(Object.keys(PARKS).map(async k=>{
    try{waits[k]={ts:Date.now(),list:await loadPark(k)};delete werr[k]}
    catch(e){werr[k]=e&&e.name==="AbortError"?"The wait-time service timed out.":"Couldn’t reach the wait-time service. You may be offline, or the service may block browsers."}
  }));
  store.set("waits",waits);wBusy=false;paint();
  if(state.tab==="rides")$("#view").innerHTML=ridesHTML();
}
const fresh=k=>waits[k]&&Date.now()-waits[k].ts<15*60e3;
function entryFor(k,q){
  const w=waits[k];if(!w||!q)return null;
  for(const part of q.split("|")){const e=w.list.find(x=>x.x.includes(part));if(e)return e}
  return null;
}
function chip(e){
  if(!e)return null;
  if(e.s==="OPERATING"){
    if(e.w==null)return null;
    return {t:e.w+" min",c:e.w<=20?"w-low":e.w<=45?"w-mid":"w-high"};
  }
  return {t:({CLOSED:"Closed",DOWN:"Down",REFURBISHMENT:"Refurb"})[e.s]||String(e.s),c:"w-high"};
}
function paint(){

    const k=el.dataset.p,c=fresh(k)?chip(entryFor(k,el.dataset.q)):null;
    el.className="wt"+(c?" on "+c.c:"");

}

const geo=store.get("geo",{});   // {ak:{ts,list:[{x,lat,lng}]}, mk:{...}}  positions from ThemeParks.wiki
const gerr={};
function flat(a,out=[]){(a||[]).forEach(e=>{out.push(e);if(e.children)flat(e.children,out)});return out}
async function loadGeo(k){
  const g=geo[k];
  if(g&&Date.now()-g.ts<24*3600e3)return;
  try{
    const j=await getJSON(API+"/entity/"+PARKS[k].id+"/children");
    const list=flat(j.children).map(e=>{
      const l=e.location||{},lat=l.latitude!=null?l.latitude:l.lat,lng=l.longitude!=null?l.longitude:l.lng;
      return {x:norm(e.name||""),lat,lng};
    }).filter(e=>e.x&&typeof e.lat==="number"&&typeof e.lng==="number");
    if(list.length){geo[k]={ts:Date.now(),list};delete gerr[k];store.set("geo",geo)}
    else gerr[k]="The data service sent no positions."
  }catch(e){gerr[k]="Couldn’t load stop positions. You may be offline."}
}
function refreshGeo(){
  return Promise.all(Object.keys(PARKS).map(loadGeo)).then(()=>{
    if(state.tab==="plan")paintWalk();
    if(state.tab==="map"){paintLegs();drawMap()}
  });
}
function placeFor(k,spec){
  if(!spec)return null;
  const list=geo[k]&&geo[k].list;
  if(list){for(const part of String(spec[1]).split("|")){const e=list.find(x=>x.x.includes(part));if(e)return {name:spec[0],lat:e.lat,lng:e.lng}}}
  return spec[2]?{name:spec[0],lat:spec[2][0],lng:spec[2][1]}:null;
}
function dayStops(day){
  const stops=[],missing=[];
  day.blocks.forEach(b=>b.items.forEach(x=>{
    if(x.f==="removed")return;
    const spec=x.g||x.w;if(!spec)return;
    const p=placeFor(day.pk,spec);
    if(!p){if(!missing.includes(spec[0]))missing.push(spec[0]);return}
    const last=stops[stops.length-1];
    if(last&&last.name===p.name)return;
    stops.push({name:p.name,lat:p.lat,lng:p.lng,time:b.s});
  }));
  return {stops,missing};
}
function legsOf(stops){
  const out=[];
  for(let i=1;i<stops.length;i++){
    const m=dist(stops[i-1],stops[i])*PATH_FACTOR;
    out.push({m,min:Math.max(1,Math.round(m/WALK_MS/60))});
  }
  return out;
}
function paintWalk(){
  const el=$("#walkline");if(!el)return;
  const {stops,missing}=dayStops(DAYS[state.day]);
  if(stops.length<2){el.textContent=gerr[DAYS[state.day].pk]||"";return}
  const lg=legsOf(stops),m=lg.reduce((a,l)=>a+l.m,0),min=lg.reduce((a,l)=>a+l.min,0);
  el.textContent="Walking today: about "+min+" min ("+(m/1609.34).toFixed(1)+" mi), between "+stops.length+" mapped stops"+(missing.length?"; "+missing.length+" have no map position":"")+". Straight-line estimate at stroller pace.";
}
function paintLegs(){
  const el=$("#legs");if(!el)return;
  const day=DAYS[state.day],{stops,missing}=dayStops(day);
  if(!stops.length){el.innerHTML='<p class="note">'+(gerr[day.pk]||"Stop positions are loading.")+' The map still shows the park.</p>';return}
  const lg=legsOf(stops),total=lg.reduce((a,l)=>a+l.min,0);
  el.innerHTML='<ol class="legs">'+stops.map((s,i)=>'<li><b>'+(i+1)+'. '+s.name+'</b><span class="meta">'+fmt(s.time)
    +(i?". "+fmtDist(lg[i-1].m)+", about "+lg[i-1].min+" min from the last stop":"")+'</span></li>').join("")+'</ol>'
    +'<p class="note">About '+total+' min of walking in total. Straight lines, so real paths run longer.</p>'
    +(missing.length?'<p class="note">No map position for: '+missing.join(", ")+'.</p>':"");
}

function drawMap(){
  if(!mapObj||state.tab!=="map")return;
  if(mapLayer)mapLayer.remove();
  mapLayer=L.layerGroup().addTo(mapObj);
  const day=DAYS[state.day],{stops}=dayStops(day);
  const col=(getComputedStyle(document.body).getPropertyValue("--c")||"#1F7A4D").trim();
  if(stops.length>1)L.polyline(stops.map(s=>[s.lat,s.lng]),{color:col,weight:3,opacity:.75,dashArray:"6 8"}).addTo(mapLayer);
  stops.forEach((s,i)=>{
    L.marker([s.lat,s.lng],{icon:L.divIcon({className:"pin",html:"<span>"+(i+1)+"</span>",iconSize:[28,28],iconAnchor:[14,14]}),title:s.name})
      .bindPopup("<b>"+(i+1)+". "+s.name+"</b><br>"+fmt(s.time)).addTo(mapLayer);
  });
  rows.forEach(r=>{
    L.circleMarker([r.lat,r.lng],{radius:8,color:"#fff",weight:2,fillColor:"#17202B",fillOpacity:1})
      .bindTooltip(esc(who(r.member))+(r.member===G.me?" (you)":""),{permanent:true,direction:"top",offset:[0,-8]}).addTo(mapLayer);
  });
  if(lastPos&&!rows.some(r=>r.member===G.me)){
    L.circleMarker([lastPos.lat,lastPos.lng],{radius:8,color:"#fff",weight:2,fillColor:"#2563EB",fillOpacity:1})
      .bindTooltip("You",{permanent:true,direction:"top",offset:[0,-8]}).addTo(mapLayer);
  }
  if(!mapFitted&&stops.length){mapFitted=true;mapObj.fitBounds(L.latLngBounds(stops.map(s=>[s.lat,s.lng])),{padding:[30,30],maxZoom:17})}
}

/* ---------- group location sharing (Supabase) ---------- */
const G=store.get("grp",{});          // {u,k,code,me,share}
const gSave=()=>store.set("grp",G);
const gU=()=>G.u||CONFIG.SUPABASE_URL;
const gK=()=>G.k||CONFIG.SUPABASE_KEY;
const okUrl=u=>/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/i.test(u||"");
const rand=n=>{const a=new Uint8Array(n),A="abcdefghjkmnpqrstuvwxyz23456789";crypto.getRandomValues(a);return Array.from(a,b=>A[b%A.length]).join("")};
const who=m=>String(m).split("~")[0];
let watch=null,lastPos=null,lastSent=0,rows=[],gErr="",gStat="";

async function rpc(fn,body){
  const h={"Content-Type":"application/json",apikey:gK()};
  if(/^eyJ/.test(gK()))h.Authorization="Bearer "+gK();
  const r=await fetch(gU().replace(/\/$/,"")+"/rest/v1/rpc/"+fn,{method:"POST",headers:h,body:JSON.stringify(body)});
  if(!r.ok)throw new Error(fn+" "+r.status);
  const t=await r.text();return t?JSON.parse(t):null;
}
function setStat(t){gStat=t;const e=$("#gstat");if(e)e.textContent=t}
async function send(){
  if(!lastPos||!G.code||!G.me)return;
  lastSent=Date.now();
  try{await rpc("share_location",{p_code:G.code,p_member:G.me,p_lat:lastPos.lat,p_lng:lastPos.lng,p_acc:lastPos.acc});setStat("Sharing. Last sent "+clock()+".");if(state.tab==="group"||state.tab==="map")refreshMembers()}
  catch(e){setStat("Couldn’t send your location. Will retry.")}
}
function onPos(p){
  lastPos={lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy)};
  if(Date.now()-lastSent>=15000)send();
  if(state.tab==="group")renderMembers();
}
function onGeoErr(e){
  if(e.code===1){setStat("Location is blocked. Allow it in your browser or phone settings, then try again.");stopShare();if(state.tab==="group")render()}
  else setStat("Still looking for a location fix.");

function ago(iso){const s=Math.max(0,(Date.now()-new Date(iso))/1000);return s<45?"just now":s<3600?Math.round(s/60)+" min ago":Math.round(s/3600)+" h ago"}
const rad=x=>x*Math.PI/180;
function dist(a,b){const dl=rad(b.lat-a.lat),dg=rad(b.lng-a.lng),h=Math.sin(dl/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dg/2)**2;return 2*6371000*Math.asin(Math.sqrt(h))}
function bearing(a,b){const y=Math.sin(rad(b.lng-a.lng))*Math.cos(rad(b.lat)),x=Math.cos(rad(a.lat))*Math.sin(rad(b.lat))-Math.sin(rad(a.lat))*Math.cos(rad(b.lat))*Math.cos(rad(b.lng-a.lng));return (Math.atan2(y,x)*180/Math.PI+360)%360}
const DIRS=["north","northeast","east","southeast","south","southwest","west","northwest"];
function fmtDist(m){const ft=m*3.28084;return ft<1000?Math.max(10,Math.round(ft/10)*10)+" ft":(m/1609.34).toFixed(1)+" mi"}

const GD={rows:store.get("gd",{}),pend:{},dirty:store.get("gddirty",[]),avail:null,busy:false};   // rows: "kind|key" -> text

function gdCall(op){
  return op.o==="put"?rpc("gd_put",{p_code:G.code,p_kind:op.kind,p_key:op.key,p_val:op.val}):rpc("gd_del",{p_code:G.code,p_kind:op.kind,p_key:op.key});
}
function gdQueue(op){GD.dirty=GD.dirty.filter(d=>!(d.kind===op.kind&&d.key===op.key));GD.dirty.push(op);gdSave()}
function gdSend(op){
  if(!grouped()||GD.avail===false)return;

    .catch(e=>{if(/ 404/.test(String(e&&e.message)))GD.avail=false;gdQueue(op)});
}

async function gdSync(){
  if(!grouped()||GD.busy)return;
  GD.busy=true;const was=GD.avail;let changed=false;
  try{
    if(G.gdFor!==G.code){   // first time in this group: share what's already on this phone
      for(const a of Object.keys(GD.rows)){const i=a.indexOf("|");await rpc("gd_put",{p_code:G.code,p_kind:a.slice(0,i),p_key:a.slice(i+1),p_val:GD.rows[a]})}
      G.gdFor=G.code;gSave();
    }
    for(const op of GD.dirty.slice()){await gdCall(op);GD.dirty=GD.dirty.filter(d=>!(d.kind===op.kind&&d.key===op.key))}
    const list=(await rpc("gd_list",{p_code:G.code}))||[];
    const next={};list.forEach(r=>{next[gk(r.kind,r.key)]=r.val});
    const now=Date.now();
    Object.keys(GD.pend).forEach(a=>{   // keep very recent local edits until the server catches up
      if(now-GD.pend[a]<5000){if(a in GD.rows)next[a]=GD.rows[a];else delete next[a]}else delete GD.pend[a];
    });
    changed=JSON.stringify(next)!==JSON.stringify(GD.rows);
    GD.rows=next;GD.avail=true;gdSave();
  }catch(e){
    if(/ 404/.test(String(e&&e.message)))GD.avail=false;   // the setup SQL hasn't been run yet
  }finally{GD.busy=false}
  if(changed||was!==GD.avail)softRender();
}

const CK_KINDS=["ride","show","meet","walk","exp"];
function catFor(k,spec){
  if(!spec)return null;

function rkOf(k,x){
  if(x.ck===0||!CK_KINDS.includes(x.k))return null;
  const spec=x.w||x.g;if(!spec)return null;

  return gdAll("rem").map(r=>{let v={};try{v=JSON.parse(r.val)||{}}catch(e){}return {id:r.key,t:String(v.t||""),due:v.due||"",done:!!v.done,by:v.by||""}});
}
function remPut(r){gdSet("rem",r.id,JSON.stringify({t:r.t,due:r.due,done:r.done,by:r.by||myName()}))}
const isDue=r=>!r.done&&r.due&&new Date(r.due)<=new Date();
function dueLabel(r){return r.due?new Date(r.due).toLocaleString([],{weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}):""}
(function migrateOldReminders(){   // reminders saved on this phone by the previous version
  const old=store.get("rem",[]);
  if(old&&old.length){old.forEach(r=>{if(gdGet("rem",r.id)===undefined)GD.rows[gk("rem",r.id)]=JSON.stringify({t:r.t,due:r.due||"",done:!!r.done,by:""})});gdSave();store.set("rem",[])}
})();
function dueBanner(){
  const d=remList().filter(isDue);
  if(!d.length)return "";
  return '<div class="remind"><b>Reminder'+(d.length>1?"s":"")+'</b>'+d.map(r=>'<div class="rline"><span>'+esc(r.t)+'</span><button type="button" class="btn" data-act="rdone" data-id="'+r.id+'">Done</button></div>').join("")+'</div>';
}
function remindersHTML(){
  const list=remList().sort((a,b)=>(a.done-b.done)||((a.due||"9")>(b.due||"9")?1:-1));
  const rows=list.map(r=>{
    if(state.editRem===r.id)return '<li class="rem"><label class="lbl" for="re_t">Note or reminder</label><input class="inp" id="re_t" maxlength="200" value="'+esc(r.t)+'">'
      +'<label class="lbl" for="re_d">When (optional)</label><input class="inp" id="re_d" type="datetime-local" value="'+esc(r.due||"")+'">'
      +'<div class="btns"><button type="button" class="btn pri" data-act="rsave" data-id="'+r.id+'">Save</button><button type="button" class="btn" data-act="rcancel">Cancel</button></div></li>';
    return '<li class="rem'+(r.done?" done":"")+'"><label class="remlab"><input type="checkbox" data-r="'+r.id+'"'+(r.done?" checked":"")+'><span class="tx"><span class="ttl">'+esc(r.t)+'</span>'
      +(isDue(r)?'<span class="badge b-removed">Due</span>':"")+'<small>'+(r.due?dueLabel(r)+". ":"")+(r.by?"Added by "+esc(r.by):"")+'</small></span></label>'
      +'<div class="rbtns"><button type="button" class="linkbtn" data-act="redit" data-id="'+r.id+'">Edit</button><button type="button" class="linkbtn" data-act="rdel" data-id="'+r.id+'">Delete</button></div></li>';
  }).join("");
  const how=grouped()?(GD.avail===false?"Sharing is off until the updated setup SQL is run (see the note above).":"Shared with your whole group. Anyone can add, edit, check off or delete, and changes show up within about 15 seconds."):"Saved on this phone only. Join your group on the Group tab to share them.";
  return '<section class="sec"><h2>Group notes and reminders</h2>'+gdNotice()+'<p>'+how+' Reminders with a time show at the top of the Plan tab once they’re due, while the app is open. They don’t buzz your phone when it’s closed.</p>'
    +'<label class="lbl" for="rt">New note or reminder</label><input class="inp" id="rt" maxlength="200" placeholder="Book the boutique, buy ponchos...">'
    +'<label class="lbl" for="rd">When (optional)</label><input class="inp" id="rd" type="datetime-local">'
    +'<div class="btns"><button type="button" class="btn pri" data-act="radd">Add</button></div>'
    +(rows?'<ul class="catlist" style="list-style:none;padding:0;margin:8px 0 0">'+rows+'</ul>':'<p class="note">Nothing here yet.</p>')+'</section>'
    +'<section class="sec"><h2>Private notes</h2><p>Only on this phone. Saves as you type.</p>'
    +'<textarea class="inp" id="memo" rows="5" placeholder="Locker number, where we parked...">'+esc(memo)+'</textarea></section>';
}

  const q=Math.max(1,Math.ceil(x.a*hc.a+x.k*hc.k-1e-9));

}

function render(){
  const day=DAYS[state.day];
  document.body.className=day.cls;
  $("#days").innerHTML=DAYS.map((d,i)=>'<button type="button" class="day-btn '+d.cls+'" data-day="'+i+'" aria-pressed="'+(i===state.day)+'">'
    +'<span class="dw">'+d.dw+'</span><span class="dn">'+d.dn+'</span><span class="dp">'+d.short+'</span></button>').join("");
  document.querySelectorAll(".tab").forEach(b=>{if(b.dataset.tab===state.tab)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  $("#days").style.display=state.tab==="plan"||state.tab==="map"?"":"none";
  if(state.tab!=="map"&&mapObj){mapObj.remove();mapObj=null;mapLayer=null}
  const view={plan:planHTML,map:mapHTML,rides:ridesHTML,meals:mealsHTML,group:groupHTML,notes:notesHTML}[state.tab]||planHTML;
  $("#view").innerHTML=view();
  $("#view").insertAdjacentHTML("beforeend",'<p class="sig">Created by Avinash</p>');
  $("#count").textContent=countdown();
  paint();
  if(state.tab==="plan")paintWalk();
  if(state.tab==="map"){initMap();if(G.code&&gU()&&gK())refreshMembers()}
  if(state.tab==="group"){renderMembers();refreshMembers()}
  if(state.tab==="rides"&&(!waits[state.wp||day.pk]||Date.now()-(waits[state.wp||day.pk].ts)>60e3))refreshWaits();
}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("on"),2200)}
async function shareLink(title,text,url){
  try{
    if(navigator.share)await navigator.share({title,text,url});
    else{await navigator.clipboard.writeText(url);toast("Link copied")}
  }catch(err){if(err&&err.name!=="AbortError")toast("Couldn’t share. Copy the link from the address bar.")}
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const a=e.target.closest("[data-act]");
  if(a){
    const act=a.dataset.act;
    if(act==="wpark"){state.wp=a.dataset.p;render()}
    else if(act==="wrefresh"){toast("Refreshing");refreshWaits()}
    else if(act==="cfilter"){state.cf=a.dataset.f;render()}
    else if(act==="gorides"){state.wp=DAYS[state.day].pk;state.cf="all";state.tab="rides";store.set("tab","rides");render();window.scrollTo(0,0)}
    else if(act==="radd"){
      const t=($("#rt").value||"").trim();if(!t)return toast("Type something first");
      remPut({id:rand(8),t:t.slice(0,200),due:$("#rd").value||"",done:false});render();toast("Added");
    }
    else if(act==="redit"){state.editRem=a.dataset.id;render()}
    else if(act==="rcancel"){state.editRem=null;render()}
    else if(act==="rsave"){
      const r=remList().find(x=>x.id===a.dataset.id),t=($("#re_t").value||"").trim();
      if(!r)return;if(!t)return toast("It can’t be empty");
      r.t=t.slice(0,200);r.due=$("#re_d").value||"";state.editRem=null;remPut(r);render();
    }
    else if(act==="rdel"){gdDel("rem",a.dataset.id);render()}
    else if(act==="rdone"){const r=remList().find(x=>x.id===a.dataset.id);if(r){r.done=true;remPut(r);render()}}
    else if(act==="ck"){
      const key=a.dataset.rk+"~"+a.dataset.p,y=window.scrollY;
      if(gdGet("ride",key)!==undefined)gdDel("ride",key);else gdSet("ride",key,"1");
      render();window.scrollTo(0,y);
    }
    else if(act==="padd"){const err=addPerson($("#pn").value);if(err)return toast(err);state.pplOpen=true;render();toast("Added")}
    else if(act==="prem"){const err=removePerson(a.dataset.n);if(err)return toast(err);state.pplOpen=true;render()}
    else if(act==="gpeople"){state.pplOpen=true;state.wp=DAYS[state.day].pk;state.cf="all";state.tab="rides";store.set("tab","rides");render();window.scrollTo(0,0)}
    else if(act==="mview"){state.mv=a.dataset.v;render()}
    else if(act==="hc"){const w=a.dataset.w,v=hc[w]+(+a.dataset.d);hc[w]=Math.max(w==="a"?1:0,Math.min(12,v));store.set("hc",hc);render()}
    else if(act==="sxadd"){
      const t=($("#sxt").value||"").trim();if(!t)return toast("Type an item first");
      gdSet("shopx",rand(8),JSON.stringify({t:t.slice(0,80),done:false,by:myName()}));render();
    }
    else if(act==="sxdel"){gdDel("shopx",a.dataset.id);render()}
    else if(act==="mfit"){const {stops}=dayStops(DAYS[state.day]);if(mapObj&&stops.length)mapObj.fitBounds(L.latLngBounds(stops.map(s=>[s.lat,s.lng])),{padding:[30,30],maxZoom:17});else toast("No stop positions yet")}
    else if(act==="mlocate"){
      if(!navigator.geolocation)return toast("This browser can’t read location");
      navigator.geolocation.getCurrentPosition(p=>{lastPos={lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy)};drawMap();if(mapObj)mapObj.setView([lastPos.lat,lastPos.lng],Math.max(mapObj.getZoom(),17))},()=>toast("Location is blocked"),{enableHighAccuracy:true,timeout:15000});
    }
    else if(act==="gsql"){navigator.clipboard.writeText(SETUP_SQL_ALL).then(()=>toast("SQL copied"),()=>toast("Couldn’t copy. Open “Show the SQL” and copy it by hand."))}
    else if(act==="gsave"){
      const u=($("#gu").value||"").trim().replace(/\/$/,""),k=($("#gk").value||"").trim();
      if(!okUrl(u))return toast("The URL should look like https://abcd.supabase.co");
      if(k.length<20||/service_role/i.test(k))return toast("Paste the publishable key, not a secret key");
      G.u=u;G.k=k;gSave();render();
    }
    else if(act==="gstart"){G.code=rand(24);gSave();render();gdSync()}
    else if(act==="gname"){
      const n=($("#gn").value||"").replace(/~/g," ").trim().slice(0,24);
      if(!n)return toast("Enter your name");
      G.me=n+"~"+rand(3);gSave();syncPeople();gdSync();render();
    }
    else if(act==="gshare"){if(watch==null)startShare();else stopShare();render()}
    else if(act==="gdist"){
      if(!navigator.geolocation)return toast("This browser can’t read location");
      navigator.geolocation.getCurrentPosition(p=>{lastPos={lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy)};render()},()=>toast("Location is blocked"),{enableHighAccuracy:true,timeout:15000});
    }
    else if(act==="ginvite")shareLink("Join our Disney trip group","Open this to see the plan and the group map.",inviteLink());
    else if(act==="gleave"){
      if(!confirm("Leave the group? You’ll stop sharing and need a new invite to rejoin."))return;
      stopShare().then(()=>{G.code=null;G.me=null;rows=[];gSave();render()});
    }
    return;
  }
  const d=e.target.closest("[data-day]");
  if(d){state.day=+d.dataset.day;if(state.tab!=="map")state.tab="plan";render();window.scrollTo(0,0);return}
  const t=e.target.closest("[data-tab]");
  if(t){state.tab=t.dataset.tab;store.set("tab",state.tab);render();window.scrollTo(0,0);return}
});
document.addEventListener("input",e=>{if(e.target.id==="memo"){memo=e.target.value;store.set("memo",memo)}});
document.addEventListener("change",e=>{
  const d=e.target.dataset||{};
  if(d.r){const r=remList().find(x=>x.id===d.r);if(r){r.done=e.target.checked;remPut(r);render()}return}
  if(d.sh){const y=window.scrollY;if(e.target.checked)gdSet("shop",d.sh,myName());else gdDel("shop",d.sh);render();window.scrollTo(0,y);return}
  if(d.sx){const r=gdGet("shopx",d.sx);let v={};try{v=JSON.parse(r||"{}")}catch(x){}v.done=e.target.checked;v.by=myName();gdSet("shopx",d.sx,JSON.stringify(v));render();return}
  const k=e.target.dataset&&e.target.dataset.k;
  if(!k)return;
  if(e.target.checked)done[k]=1;else delete done[k];
  store.set("done2",done);
});
document.addEventListener("toggle",e=>{const k=e.target.dataset&&e.target.dataset.s;if(k)state[k]=e.target.open},true);
$("#share").addEventListener("click",()=>shareLink("Disney World trip plan","Our Disney World plan, Nov 21–25",location.href.split("#")[0]));

/* ---------- start ---------- */
(function joinFromLink(){
  if(!location.hash)return;
  const p=new URLSearchParams(location.hash.slice(1)),g=p.get("g");
  if(!g)return;
  if(/^[a-z0-9]{20,64}$/i.test(g)){
    if(G.code&&G.code!==g){G.me=null;G.share=false}
    G.code=g;
    const u=p.get("u"),k=p.get("k");
    if(okUrl(u))G.u=u.replace(/\/$/,"");        // only *.supabase.co is accepted
    if(k&&/^[\w.\-]{20,600}$/.test(k)&&!/service_role/i.test(k))G.k=k;
    gSave();state.tab="group";
  }
  history.replaceState(null,"",location.pathname+location.search);
})();
state.day=pickDay();
render();
const nowEl=$("#now");
if(nowEl&&state.tab==="plan")nowEl.scrollIntoView({block:"center"});
refreshWaits();
refreshGeo();
if(grouped()){syncPeople();gdSync()}
if(G.share&&G.code&&G.me&&gU()&&gK())startShare();
setInterval(()=>{
  if(document.hidden)return;
  if(state.tab==="plan"){
    const open=document.activeElement&&document.activeElement.tagName==="INPUT";
    if(!open){const y=window.scrollY;render();window.scrollTo(0,y)}
  }
},60000);
setInterval(()=>{if(!document.hidden&&(state.tab==="rides"||state.tab==="plan"))refreshWaits()},120000);
setInterval(()=>{if(!document.hidden&&(state.tab==="group"||(state.tab==="map"&&G.code&&gU()&&gK())))refreshMembers()},15000);
setInterval(()=>{if(!document.hidden)gdSync()},15000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden){gdSync();const k=DAYS[state.day].pk;if(!waits[k]||Date.now()-waits[k].ts>60e3)refreshWaits()}});
if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0)navigator.serviceWorker.register("sw.js").catch(()=>{});

</script>
